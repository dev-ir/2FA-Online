<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2FA Code Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/otpauth@9.0.2/dist/otpauth.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.6rem;
      text-align: center;
      color: #1a73e8;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 30px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #1a73e8;
      outline: none;
    }

    button {
      margin-top: 15px;
      width: 100%;
      background-color: #1a73e8;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #155ea6;
    }

    .code-result {
      margin-top: 25px;
      padding: 20px;
      background-color: #f1f3f4;
      border-radius: 8px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
    }

    .key-format {
      font-size: 0.85rem;
      color: #888;
      margin-top: 5px;
    }

    #timer {
      font-size: 1rem;
      color: #27ae60;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 40px;
      padding: 20px;
    }

    .copy-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 12px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .copy-btn:hover {
      background-color: #388e3c;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>2FA Code Generator</h1>
    <p>A minimal client-side TOTP generator with QR support</p>

    <input type="text" id="secret" placeholder="Enter your secret key (with or without spaces)" />
    <div class="key-format">Supports formats like: ABCDEFGHIJKLMNOP or ABCD EFGH IJKL MNOP</div>

    <button onclick="generateCode()">Generate Code</button>

    <div class="code-result">
      Current Code: <span id="code">------</span><br/>
      <span id="timer"></span>
    </div>

    <button class="copy-btn" onclick="copyCode()">Copy Code</button>
  </div>

  <footer>
    Developed by <a href="https://t.me/dvhost_cloud" target="_blank" style="color:#1a73e8; text-decoration:none;">DVHOST.CLOUD</a> |
    <a href="https://github.com/dev-ir" target="_blank" style="color:#1a73e8; text-decoration:none;">GitHub</a>
  </footer>

  <script>
    let timerInterval;

    function normalizeSecret(secret) {
      return secret.replace(/\s+/g, '').toUpperCase();
    }

    function getURLParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    function generateCode() {
      let secret = document.getElementById('secret').value.trim();

      // Check if hash parameter exists in URL and is empty
      const hashParam = getURLParameter("hash");
      if (!secret && hashParam) {
        secret = hashParam;
        document.getElementById('secret').value = hashParam;
      }

      if (!secret) {
        alert('Please enter a secret key or provide it via ?hash=... in the URL');
        return;
      }

      secret = normalizeSecret(secret);

      if (!/^[A-Z2-7]+$/.test(secret)) {
        alert('Invalid secret key format. Use Base32 characters only.');
        return;
      }

      if (timerInterval) clearInterval(timerInterval);

      try {
        const totp = new OTPAuth.TOTP({
          algorithm: 'SHA1',
          digits: 6,
          period: 30,
          secret: OTPAuth.Secret.fromBase32(secret)
        });

        updateCode(totp);
        timerInterval = setInterval(() => updateCode(totp), 1000);
      } catch (e) {
        alert('Error generating code. Please check your key.');
        console.error(e);
      }
    }

    function updateCode(totp) {
      const code = totp.generate();
      document.getElementById('code').textContent = code;

      const epoch = Math.round(Date.now() / 1000);
      const remainingSeconds = 30 - (epoch % 30);
      const timerText = `${remainingSeconds} second${remainingSeconds !== 1 ? 's' : ''}`;
      document.getElementById('timer').textContent = timerText;

      const timerElement = document.getElementById('timer');
      timerElement.style.color = remainingSeconds <= 5 ? '#e74c3c' : '#27ae60';
    }

    function copyCode() {
      const code = document.getElementById('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        alert('Code copied to clipboard!');
      }).catch(() => {
        alert('Failed to copy code.');
      });
    }

    window.onload = function () {
      const hash = getURLParameter("hash");
      if (hash) {
        document.getElementById('secret').value = hash;
        generateCode();
      }
    };
  </script>
</body>
</html>
